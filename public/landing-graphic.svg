<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="300" viewBox="0 0 260 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <circle cx="130" cy="150" r="120" fill="#1f2225" />
  <circle cx="130" cy="150" r="90" fill="#2b2f33" />
  
  <!-- Code editor window -->
  <rect x="30" y="80" width="200" height="140" rx="8" fill="#151719" stroke="#4d5359" stroke-width="2" />
  
  <!-- Window controls -->
  <circle cx="45" cy="95" r="4" fill="#f43f5e" />
  <circle cx="60" cy="95" r="4" fill="#fbbf24" />
  <circle cx="75" cy="95" r="4" fill="#10b981" />
  
  <!-- Code lines -->
  <rect x="45" y="115" width="120" height="6" rx="3" fill="#8b5cf6" opacity="0.8" />
  <rect x="45" y="130" width="90" height="6" rx="3" fill="#73e5bf" opacity="0.8" />
  <rect x="45" y="145" width="150" height="6" rx="3" fill="#a37af5" opacity="0.8" />
  <rect x="45" y="160" width="70" height="6" rx="3" fill="#73e5bf" opacity="0.8" />
  <rect x="45" y="175" width="110" height="6" rx="3" fill="#8b5cf6" opacity="0.8" />
  
  <!-- Decorative elements -->
  <circle cx="230" cy="100" r="15" fill="url(#paint0_linear)" />
  <circle cx="30" cy="200" r="20" fill="url(#paint1_linear)" />
  <circle cx="210" cy="220" r="12" fill="url(#paint2_linear)" />
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="paint0_linear" x1="215" y1="100" x2="245" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73e5bf" />
      <stop offset="1" stop-color="#a37af5" />
    </linearGradient>
    <linearGradient id="paint1_linear" x1="10" y1="200" x2="50" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73e5bf" />
      <stop offset="1" stop-color="#a37af5" />
    </linearGradient>
    <linearGradient id="paint2_linear" x1="198" y1="220" x2="222" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73e5bf" />
      <stop offset="1" stop-color="#a37af5" />
    </linearGradient>
  </defs>
